[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-ssh-password-rotate"
version = "0.1.0"
description = "Change a Windows local account's password over SSH without screen scraping, verify it by signing in, and probe how a host's shell treats Enter."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["paramiko>=3.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
winssh-rotate = "winssh_rotate.cli:main"

[tool.setuptools]
packages = ["winssh_rotate"]
