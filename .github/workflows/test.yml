name: test

on: [push, pull_request]

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -v tests/test_offline.py

  windows-openssh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: install and start OpenSSH Server, create the admin account, set the lockout policy
        shell: pwsh
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }
          # The runner image's sshd_config only admits listed groups (seen in the sshd event log:
          # "not allowed because none of user's groups are listed in AllowGroups"). Add Users.
          $cfg = "$env:ProgramData\ssh\sshd_config"
          if (Test-Path $cfg) {
            Select-String -Path $cfg -Pattern '^\s*(AllowGroups|AllowUsers|DenyUsers|DenyGroups)' | ForEach-Object { "before: $($_.Line)" }
            (Get-Content $cfg) -replace '^(\s*AllowGroups\s+.*)$', '$1 users' | Set-Content -Encoding ascii $cfg
            Select-String -Path $cfg -Pattern '^\s*AllowGroups' | ForEach-Object { "after:  $($_.Line)" }
          }
          Restart-Service sshd -ErrorAction SilentlyContinue; Start-Service sshd
          & "$env:WINDIR\System32\OpenSSH\sshd.exe" -V 2>&1
          New-LocalUser -Name rot_admin -Password (ConvertTo-SecureString $env:ADMIN_PW -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Administrators -Member rot_admin
          net accounts /minpwlen:12 /lockoutthreshold:3 /lockoutwindow:30 /lockoutduration:30
          ssh-keyscan -t ed25519 localhost 2>$null | Out-File -Encoding ascii "$env:RUNNER_TEMP\known_hosts"
          Get-Content "$env:RUNNER_TEMP\known_hosts"
        env:
          ADMIN_PW: Ci-admin-pass-0001
      - name: tests against the real OpenSSH server
        run: pytest -v -s -rs tests/test_windows.py
        env:
          WSPR_TEST_KNOWN_HOSTS: ${{ runner.temp }}\known_hosts
          WSPR_TEST_ADMIN_PW: Ci-admin-pass-0001
      - name: sshd events (on failure)
        if: failure()
        shell: pwsh
        run: |
          net accounts
          Get-WinEvent -LogName OpenSSH/Operational -MaxEvents 60 | Sort-Object TimeCreated |
            Format-Table -AutoSize -Wrap TimeCreated, Id, Message | Out-String -Width 300

  linux-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: sshd with a password account, for comparison with Windows
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
          echo 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/00-probe.conf
          sudo useradd -m -s /bin/bash probe && echo 'probe:Probe-pass-0001' | sudo chpasswd
          sudo systemctl restart ssh || sudo service ssh restart
          ssh-keyscan -t ed25519 localhost > known_hosts
      - name: probe a bash shell
        env:
          PROBE_PW: Probe-pass-0001
        run: winssh-rotate probe --host localhost --known-hosts known_hosts --user probe --password-env PROBE_PW --raw 400
